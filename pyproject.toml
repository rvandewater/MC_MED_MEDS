[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MC-MED-MEDS"
# Bumped with `uv version --bump ...`; merging a new version into main publishes it (see CONTRIBUTORS.md).
version = "0.2.0"
authors = [
  { name="Robin van de Water", email="r.p.vandewater@gmail.com" },
]
description = "An ETL to extract the MC-MED (Multimodal Clinical Monitoring in the Emergency Department) dataset into the MEDS format."
readme = "README.md"
# Mirrors MEDS-Extract 0.8's own interpreter range; a looser floor/ceiling here would admit
# interpreters it cannot be installed on.
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Capped explicitly below the next minor: MEDS-Extract 0.x minors are breaking (MESSY syntax, runner
# CLI), so raise this deliberately when migrating. The `[download]` extra provides
# `meds-extract-download`, which `meds-extract-run` spawns to stage the raw data.
# MEDS-Extract 0.8.1 runs the `etl.post_stages` the spec declares after the canonical pipeline.
# suMEDS 0.6.2 registers the `sumeds_enrich` stage the spec declares there, which enriches the code
# metadata with the rules registered below. A failed enrichment is a warning, not an error (the ETL
# output is kept as is, e.g. without internet), and `metadata/dataset.json` records whether the
# build was enriched. suMEDS is capped below the next minor for the same reason as MEDS-Extract
# (its rules format, output and CLI are still 0.x).
dependencies = [
  "MEDS-extract[download]>=0.8.1,<0.9",
  "sumeds>=0.6.2,<0.7",
]

[dependency-groups]
dev = ["pre-commit<4"]
tests = ["pytest"]

[tool.setuptools.package-data]
# Ship the MESSY config and the suMEDS rules (the YAML files under the package) with the code.
MC_MED_MEDS = ["**/*"]

[tool.setuptools.exclude-package-data]
MC_MED_MEDS = ["**/__pycache__/*", "**/*.pyc", "**/.DS_Store"]

# Registers this dataset with MEDS-Extract's generic runner: after `pip install`,
# `meds-extract-run spec=MC-MED output_dir=...` runs the whole ETL, and the
# output's provenance metadata is stamped with this package's version automatically.
[project.entry-points."MEDS_extract.pipelines"]
"MC-MED" = "MC_MED_MEDS.configs:event_configs.yaml"

# Registers the suMEDS rules under the same name, so the spec's `sumeds_enrich: {rules: MC-MED}` and
# `--rules MC-MED` find them.
[project.entry-points."sumeds.rules"]
"MC-MED" = "MC_MED_MEDS:sumeds_rules.yaml"

[project.urls]
Homepage = "https://github.com/rvandewater/MC_MED_MEDS"
Issues = "https://github.com/rvandewater/MC_MED_MEDS/issues"
