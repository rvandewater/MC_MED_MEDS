name: Synthetic ETL for MESSY files using MESSY_synth

# Generates raw files straight from the shipped MESSY config with MESSY-synth and runs the ETL over
# them. MESSY-synth validates that every event block yields events and fails the job otherwise, so
# this catches expressions that only work on the values of one particular release. It complements
# the hand-written fixtures in tests/, which check specific values.
#
# MC-MED has no pre-MEDS stage, so the whole pipeline runs, including the `sumeds_enrich`
# post-stage. That stage fetches ontology packs from GitHub; a failed fetch is a warning, not a
# failure, so it cannot make this job flaky.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # MESSY-synth requires Python >= 3.12.
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked
          # The chief-complaint and ED-diagnosis slots extract the k-th item of a comma-separated
          # list, with several regexes on one column. Released MESSY_synth cannot generate values
          # that satisfy them; pin the commit that can (mmcdermott/MESSY_synth#18) until it is
          # merged and released.
          uv pip install "MESSY_synth @ git+https://github.com/rvandewater/MESSY_synth@80a0904bf1e6679081fe1adaf58a141c08a061cf"

      - name: Generate and extract synthetic data
        run: |
          uv run --no-sync MESSY-synth ./src/MC_MED_MEDS/configs/event_configs.yaml -o raw_synthetic/ --explain
          uv run --no-sync meds-extract-run spec=MC-MED output_dir=./MC_MED_meds_synth \
            input_dir=raw_synthetic do_download=false
          for f in dataset.json codes.parquet subject_splits.parquet; do
            test -f "MC_MED_meds_synth/metadata/$f"
          done
